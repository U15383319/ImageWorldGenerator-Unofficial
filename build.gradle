plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.140'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = "${mod_version}+${minecraft_version}"
group = mod_group_id

base {
    archivesName = "ImageWorldGenerator-neoforge"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version

    runs {
        client {
            client()
        }

        server {
            server()
            // Kept apart from the client's run directory, which holds its own worlds and config.
            gameDirectory = project.file('runs/server')
            programArgument '--nogui'
        }

        configureEach {
            logLevel = org.slf4j.event.Level.INFO
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

repositories {
    exclusiveContent {
        forRepository {
            maven {
                name = "Xaero"
                url = "https://chocolateminecraft.com/maven"
            }
        }
        filter {
            includeGroup "xaero.map"
            includeGroup "xaero.lib"
        }
    }
    exclusiveContent {
        forRepository {
            maven {
                name = "Forge"
                url = "https://maven.minecraftforge.net/"
            }
        }
        filter {
            includeGroup "com.github.glitchfiend"
        }
    }
}

dependencies {
    // Optional integration: compiled against, never required at runtime.
    compileOnly "com.github.glitchfiend:TerraBlender-neoforge:${minecraft_version}-${terrablender_version}"

    // Development only: a world map to inspect generated worlds in the dev client. Not part of the mod.
    runtimeOnly "xaero.map:xaeroworldmap-neoforge-${minecraft_version}:${xaero_worldmap_version}"
    runtimeOnly "xaero.lib:xaerolib-neoforge-${minecraft_version}:${xaero_lib_version}"

    // Development only: a biome mod to try modded biomes with, and TerraBlender itself to run the integration.
    runtimeOnly "com.github.glitchfiend:TerraBlender-neoforge:${minecraft_version}-${terrablender_version}"
    runtimeOnly "com.github.glitchfiend:GlitchCore-neoforge:${minecraft_version}-${glitchcore_version}"
    runtimeOnly "com.github.glitchfiend:BiomesOPlenty-neoforge:${minecraft_version}-${biomesoplenty_version}"
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version_range: minecraft_version_range,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

jar {
    def licenseSuffix = mod_id
    // LGPL-3.0 (LICENSE) is a set of additions to GPL-3.0 (COPYING), so both texts travel with the jar.
    from(files("LICENSE", "COPYING")) {
        rename { "${it}_${licenseSuffix}" }
    }
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
